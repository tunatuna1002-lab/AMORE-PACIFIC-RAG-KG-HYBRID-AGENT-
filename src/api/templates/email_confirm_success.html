<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>인증 완료 - AMORE Pacific</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #001C58 0%, #1F5795 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .card {
            background: white;
            border-radius: 20px;
            padding: 48px;
            max-width: 420px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .icon {
            width: 80px;
            height: 80px;
            background: #d1fae5;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        .icon svg { width: 40px; height: 40px; color: #10b981; }
        h1 { color: #001C58; font-size: 24px; margin-bottom: 12px; }
        p { color: #64748b; font-size: 15px; line-height: 1.6; }
        .email {
            color: #1F5795;
            font-weight: 600;
            background: #f0f9ff;
            padding: 8px 16px;
            border-radius: 8px;
            display: inline-block;
            margin: 16px 0;
        }
        .hint {
            margin-top: 24px;
            padding: 16px;
            background: #f8fafc;
            border-radius: 12px;
            font-size: 13px;
            color: #475569;
        }
        .close-btn {
            margin-top: 24px;
            padding: 14px 32px;
            background: #001C58;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        .close-btn:hover { background: #1F5795; }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
            </svg>
        </div>
        <h1>이메일 인증 완료!</h1>
        <div class="email">$email</div>
        <p>이메일 주소가 성공적으로 인증되었습니다.</p>
        <div class="hint">
            이 창은 닫아도 됩니다.<br>
            원래 대시보드 화면에서 자동으로 다음 단계로 이동합니다.
        </div>
        <button class="close-btn" onclick="window.close()">이 창 닫기</button>
    </div>
</body>
</html>
