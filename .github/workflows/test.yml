name: Test & Lint

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ENV_FILE: .env.test

    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov pytest-timeout

      - name: Install Playwright browsers
        run: |
          playwright install chromium
          playwright install-deps chromium

      # Lint is a gate, not a warning: pyproject.toml owns the rule set
      # (line-length 100, target py311, E501/E402/B008 ignored).
      - name: Run linting (Ruff)
        run: |
          pip install ruff
          ruff check src/ tests/ scripts/
          ruff format --check src/ tests/ scripts/

      # The offline suite: unit + characterization (동작 보존 핀) + eval + adversarial.
      # Everything here must pass without network access.
      - name: Run offline test suite with coverage gate
        run: |
          python -m pytest tests/unit tests/characterization tests/eval tests/adversarial \
            -m "not slow" --tb=short --timeout=120 \
            --cov=src \
            --cov-report=term-missing \
            --cov-fail-under=55

      - name: Run integration tests (if API key available)
        if: env.OPENAI_API_KEY != ''
        run: |
          python -m pytest tests/integration -v --tb=short -x --timeout=120 \
            -k "not slow"
        continue-on-error: true

  security:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies and security tools
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install bandit pip-audit

      - name: Run Bandit security scan
        run: |
          bandit -r src/ -ll -ii --skip B101,B104
        continue-on-error: true

      - name: Check for vulnerable dependencies
        run: |
          pip-audit || true
        continue-on-error: true
